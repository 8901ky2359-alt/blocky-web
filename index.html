  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --orange:  #e07b30;
      --orange2: #c45f18;
      --cream:   #faf8f5;
      --white:   #ffffff;
      --dark:    #222222;
      --gray:    #666666;
      --gray2:   #999999;
      --border:  #e8e0d6;
    }
    html, body { height: 100%; }
    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
      background: #000;
      color: var(--dark);
      font-size: 15px;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      overflow: hidden; /* フルスクリーン固定 */
    }

    /* ── HERO（フルスクリーン） ── */
    .hero {
      position: fixed; inset: 0;
      display: flex; align-items: center;
      overflow: hidden;
    }
    .hero-bg { position: absolute; inset: 0; }
    .hero-bg video {
      width: 100%; height: 100%;
      object-fit: cover; object-position: center 20%;
      display: block;
    }
    .hero-ov {
      position: absolute; inset: 0;
      background: linear-gradient(
        160deg,
        rgba(10,5,0,.72) 0%,
        rgba(10,5,0,.48) 55%,
        rgba(10,5,0,.18) 100%
      );
    }

    /* ── ブランドロゴ（左上） ── */
    .hero-brand {
      position: absolute; top: 24px; left: 28px; z-index: 3;
      text-decoration: none;
    }
    .hero-brand-main {
      font-family: 'Noto Serif JP', serif;
      font-size: 1.2rem; font-weight: 700;
      color: #fff; letter-spacing: .05em; line-height: 1;
    }
    .hero-brand-sub {
      font-size: .58rem; color: rgba(255,255,255,.65);
      letter-spacing: .05em; margin-top: 3px; display: block;
    }

    /* ── ヒーローテキスト ── */
    .hero-body {
      position: relative; z-index: 2;
      padding: 0 48px;
      padding-bottom: 22vh; /* 中央より上に */
      max-width: 580px;
    }
    .hero-en {
      font-family: 'Noto Serif JP', serif;
      font-size: .72rem; font-weight: 400;
      color: rgba(255,255,255,.65); letter-spacing: .28em;
      text-transform: uppercase; margin-bottom: 16px;
    }
    .hero h1 {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(1.8rem, 4.2vw, 2.8rem);
      font-weight: 700; color: #fff;
      line-height: 1.55; margin-bottom: 18px;
    }
    .hero h1 em { color: #f5d498; font-style: normal; }
    .hero-sub {
      font-size: .92rem; color: rgba(255,255,255,.78);
      line-height: 1.9;
    }

    /* ── 下部3ボタン固定ナビ ── */
    .app-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 300;
      display: grid; grid-template-columns: repeat(2,1fr);
      background: rgba(255,255,255,.96);
      border-top: 1px solid var(--border);
      box-shadow: 0 -2px 20px rgba(0,0,0,.14);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .app-nav-btn {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      padding: 13px 8px 15px;
      text-decoration: none; color: var(--gray);
      font: 600 .68rem/1 'Noto Sans JP',sans-serif;
      letter-spacing: .03em;
      transition: color .15s, background .15s;
      border-right: 1px solid var(--border);
    }
    .app-nav-btn:last-child { border-right: none; }
    .app-nav-btn:hover { color: var(--orange); background: rgba(224,123,48,.05); }
    .app-nav-btn--main { color: var(--orange); }
    .app-nav-icon { font-size: 1.45rem; line-height: 1; }

    /* ── MOBILE ── */
    @media (max-width: 560px) {
      .hero-body { padding: 0 24px; padding-bottom: 18vh; }
      .hero h1 { font-size: 1.7rem; }
      .hero-sub { font-size: .84rem; }
      .app-nav-btn { padding: 11px 6px 13px; }
      .app-nav-icon { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

<!-- HERO -->
<section class="hero">

  <div class="hero-body">

</section>

<!-- 下部3ボタン固定ナビ -->
<nav class="app-nav">

  </a>
</nav>

</html>
