# main に変更が入るたびに、Cloudflare Pages の公開サイトを自動で更新する
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 公開するファイルだけをまとめる（.git / .github は公開しない）
      - name: Collect site files
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github

      # 登録時に紛れ込みやすい前後の空白・改行を取り除いてから公開する
      - name: Deploy
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$ACCOUNT" | tr -d '[:space:]')"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN が登録されていません"; exit 1; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::CLOUDFLARE_ACCOUNT_ID が登録されていません"; exit 1; fi
          npx --yes wrangler@4 pages deploy _site --project-name=serendipity --branch=main --commit-dirty=true
